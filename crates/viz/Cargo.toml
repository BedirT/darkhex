[package]
name = "darkhex-viz"
version = "0.1.0"
edition = "2021"
description = "Interactive visualization for DarkHex"
license = "MIT"

[[bin]]
name = "darkhex-viz"
path = "src/main.rs"

[dependencies]
darkhex-core = { path = "../core" }
bevy = "0.18"
hexx = { version = "0.24", features = ["mesh"] }
bevy_egui = "0.39"
rand = "0.8"
